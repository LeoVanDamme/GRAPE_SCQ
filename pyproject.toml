[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grape-scq"
version = "0.1.0"
description = "GRAPE pulse optimization for superconducting qubits -- redesigned object model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Leo Van Damme", email = "leo.vandamme@gmx.fr" },
    { name = "Amit Devra" },
    { name = "Emanuel Malvetti" },
    { name = "Steffen J. Glaser" },
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["grape_scq", "grape_scq._engine"]
